# Copy to config.toml and adjust. config.toml is gitignored.

[hub]
# Leave empty to auto-detect: bind 127.0.0.1 AND Tailscale IPv4 when available.
# Explicit Tailscale IP also dual-binds localhost. Never use 0.0.0.0.
bind_host = ""
bind_port = 8787

# Shared secret for HTTP/WS (Authorization: Bearer or ?token=).
# Required when binding non-loopback / Tailscale; empty allowed for loopback-only.
hub_token = ""

# Optional: after ACP heal attempts exhaust (process up, ACP down, no live turn),
# KillAgent-style restart once per hub process. Default off (manual pill / admin).
# auto_restart_agent_on_heal_exhaust = false

sessions_root = "~/.grok/sessions"
# Folder that contains your project directories (New Session picker).
projects_root = "~/Projects"
# grok_bin = "~/.grok/bin/grok.exe"
# max_sessions = 80
# max_history_messages = 800
# Concurrent live turns across different project folders (same cwd queues).
# max_concurrent_turns = 3

[agent]
bind = "127.0.0.1"
port = 2419
# secret_path = "data/agent.secret"
# EXPERIMENT only. Default serve. leader = hub attaches via stdio to grok agent leader.
# Desktop CLI can use: grok --leader  (same leader). Do not enable for normal use.
# backend = "serve"
